<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Pro Field Camera - GPS & Survey Watermark</title>
    <meta name="description" content="Professional GPS map field camera for geotagged photo and video documentation with real-time metadata stamping, compass heading, OSM map overlay, and site survey tools." />
    <meta property="og:title" content="Pro Field Camera - GPS & Survey Watermark" />
    <meta property="og:description" content="Professional GPS map field camera for geotagged photo and video documentation with real-time metadata stamping, compass heading, OSM map overlay, and site survey tools." />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- PWA Manifest & Theme Color -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FieldCamera" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />

    <style>
      #splash-screen {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        background-color: #ffffff;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        padding: 18vh 24px 6vh;
        box-sizing: border-box;
        z-index: 99999;
        transition: opacity 0.35s ease, visibility 0.35s ease;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .splash-center {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .splash-logo {
        width: 130px;
        height: 130px;
        border-radius: 28px;
        box-shadow: 0 16px 32px rgba(0, 0, 0, 0.12);
        margin-bottom: 28px;
        object-fit: cover;
      }

      .splash-app-title {
        font-size: 1.55rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        color: #2b3634;
        margin: 0 0 10px 0;
        text-transform: uppercase;
      }

      .splash-sub-text {
        font-size: 0.95rem;
        font-weight: 400;
        color: #667085;
        margin: 0;
        max-width: 240px;
        line-height: 1.4;
      }

      .splash-bottom {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }

      /* Subtle 3-dot loading indicator */
      .pulse-loader {
        display: flex;
        gap: 6px;
      }

      .pulse-loader span {
        width: 6px;
        height: 6px;
        background-color: #98a2b3;
        border-radius: 50%;
        animation: pulse 1.2s infinite ease-in-out both;
      }

      .pulse-loader span:nth-child(1) { animation-delay: -0.32s; }
      .pulse-loader span:nth-child(2) { animation-delay: -0.16s; }

      @keyframes pulse {
        0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
        40% { transform: scale(1); opacity: 1; }
      }

      .splash-version {
        font-size: 0.8rem;
        font-weight: 500;
        color: #98a2b3;
      }

      /* Dismiss helper */
      #splash-screen.fade-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="splash-screen">
      <div class="splash-center">
        <h1 class="splash-app-title">FIELD CAMERA</h1>
        <p class="splash-sub-text">Geotagged & timestamped field documentation</p>
      </div>

      <div class="splash-bottom">
        <div class="pulse-loader">
          <span></span>
          <span></span>
          <span></span>
        </div>
        <span class="splash-version">Version 1.0.0</span>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
